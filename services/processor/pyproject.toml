[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-processor"
version = "0.1.0"
description = "Convierte gránulos GCOV en COGs, estados por píxel y un manifiesto."
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "rasterio>=1.3.10,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
