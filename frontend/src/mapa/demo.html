<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas — banco de pruebas del mapa</title>
    <style>
      html, body { margin: 0; height: 100%; }
      #mapa { position: absolute; inset: 0; }
      #aviso {
        position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 3; max-width: 420px;
        padding: 6px 10px; border-radius: 4px; background: #fff3cd; color: #4d3800;
        font: 13px system-ui, sans-serif;
      }
      #aviso:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="mapa"></div>
    <div id="aviso" role="status"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
