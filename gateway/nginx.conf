# Punto de entrada único para el frontend. Solo lectura: GET y OPTIONS.
server {
    listen 80;

    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
    if ($request_method != GET) {
        return 405;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/catalog/ {
        proxy_pass http://catalog:8000/;
    }

    location /api/verdicts/ {
        proxy_pass http://verdicts:8000/;
    }

    # TiTiler abre lo que reciba en url=: aquí solo dejamos pasar artefactos.
    location /tiles/cog/ {
        if ($arg_url !~ "^file%3A%2F%2F%2Fdata%2Fartifacts%2F") {
            return 403;
        }
        if ($arg_url ~* "(\.\.|%2e%2e)") {
            return 403;
        }
        proxy_pass http://tiles:8000/cog/;
    }

    location / {
        return 404;
    }
}
