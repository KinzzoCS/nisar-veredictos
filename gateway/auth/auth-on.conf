# AUTH_ENABLED=1: cada petición pasa por auth /verify antes de llegar a su servicio (RF-ACC-05 y 06).
# Va en el server para que un location nuevo valide el token sin acordarse; los que no deben llevan auth_request off.
# Sin Authorization, verify responde public. Con un token roto, caducado o de otra audiencia, 401 en cualquier
# ruta, también en las actuales: nunca se degrada a public en silencio.
auth_request /_auth;
# $sent_http_* lee la respuesta de /_auth, venga de verify o del atajo sin token de abajo.
auth_request_set $auth_role $sent_http_x_auth_role;
auth_request_set $auth_sub $sent_http_x_auth_sub;
error_page 401 = @auth_invalid;
# auth_request convierte en 500 cualquier fallo de la subpetición, como un auth caído.
error_page 500 = @auth_unavailable;

location = /_auth {
    internal;
    auth_request off;
    # Sin Authorization la petición es public (RF-ACC-06) y no hace falta preguntar a auth: así las consultas sin
    # cuenta no dependen de que auth responda ni pagan la subpetición. Una cabecera vacía cuenta como ausente.
    if ($http_authorization = "") {
        add_header X-Auth-Role public always;
        return 204;
    }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Auth-Role "";
    proxy_set_header X-Auth-Sub "";
    set $auth_upstream http://auth:8000;
    rewrite ^ /verify? break;
    proxy_pass $auth_upstream;
}

location @auth_invalid {
    include /etc/nginx/snippets/cors-api.conf;
    # auth_request ya copia el WWW-Authenticate de verify a la respuesta; repetirlo lo duplicaría.
    default_type application/json;
    return 401 '{"detail":"Token no válido, caducado o de otra audiencia. Renueva la sesión en /api/auth/refresh o quita la cabecera Authorization para consultar como public."}';
}

location @auth_unavailable {
    include /etc/nginx/snippets/cors-api.conf;
    add_header Retry-After 5 always;
    default_type application/json;
    return 503 '{"detail":"No se pudo comprobar el token: el servicio auth no responde. Sin cabecera Authorization tampoco se puede consultar mientras dure."}';
}

# Rutas de auth (POST para login, register, refresh y logout; DELETE para los tokens personales). Sin auth_request:
# /login no debe fallar por un token viejo, y /me valida el suyo.
location /api/auth/ {
    auth_request off;
    client_max_body_size 4k;
    include /etc/nginx/snippets/cors-auth.conf;
    if ($request_method = OPTIONS) {
        return 204;
    }
    if ($request_method !~ ^(GET|POST|DELETE)$) {
        return 405;
    }
    # auth decide si la cookie lleva Secure según el host que ve el navegador.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Auth-Role "";
    proxy_set_header X-Auth-Sub "";
    set $auth_upstream http://auth:8000;
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass $auth_upstream;
}

# verify es solo para el gateway.
location = /api/auth/verify {
    auth_request off;
    return 404;
}
