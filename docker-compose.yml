services:
  # Genera datos sintéticos una vez; conserva lo que ya exista en ./data.
  seed:
    build: ./services/processor
    command: ["python", "-m", "processor", "seed-synthetic"]
    volumes:
      - ./data:/data
      - ./config/aois:/config/aois:ro

  # Datos reales, bajo demanda: docker compose run --rm fetch --aoi parral --series T048A-F015
  fetch:
    profiles: ["real"]
    build: ./services/ingest
    entrypoint: ["python", "-m", "ingest", "fetch"]
    env_file:
      - path: .env
        required: false
    environment:
      CATALOG_URL: http://catalog:8000
    volumes:
      - ./data:/data
      - ./config/aois:/config/aois:ro
    depends_on:
      - catalog

  # Reemplaza los artefactos sintéticos de esa serie por los reales.
  process:
    profiles: ["real"]
    build: ./services/processor
    entrypoint: ["python", "-m", "processor", "run"]
    volumes:
      - ./data:/data
      - ./config/aois:/config/aois:ro

  catalog:
    build: ./services/catalog
    environment:
      AOI_DIR: /config/aois
      # Plan de observación de NISAR que escribe `ingest plan`; sin archivo, la línea de tiempo dice unknown.
      PLAN_DIR: /data/plan
    volumes:
      - ./config/aois:/config/aois:ro
      - ./data:/data:ro

  verdicts:
    build: ./services/verdicts
    environment:
      ARTIFACT_ROOT: /data/artifacts
      # Línea de tiempo de Antena: hora UTC de adquisición y latencia de publicación (T-BAL-02).
      CATALOG_URL: http://catalog:8000
      # Opcional, del .env local: con él, verdicts lee la capa de agua de OPERA DSWx-S1 y la compara con el
      # radar real (T-BAL-08); sin él, lista el producto y dice que no se comparó. Solo esta variable, no todo el .env.
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      # Con token y radar real, el contraste con OPERA se calcula al arrancar, en segundo plano, y se guarda
      # en disco: la primera carga de T048 tardaba ~63 s y el gateway cortaba a los 60 s. Sin token no hace nada.
      VERDICTS_WARM_CACHE: "1"
      VERDICTS_CACHE_DIR: /cache
    volumes:
      - ./data:/data:ro
      - ./data/cache/verdicts:/cache
    depends_on:
      seed:
        condition: service_completed_successfully
      catalog:
        condition: service_started

  tiles:
    image: ghcr.io/developmentseed/titiler:2.4.0
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/data:ro
    depends_on:
      seed:
        condition: service_completed_successfully

  # Cuentas, sesiones y tokens de los perfiles (specs/06-acceso, Antena). Sin puerto publicado: solo el gateway
  # llega a él. La clave Ed25519 se genera al primer arranque en ./data/auth (fuera de git) si el .env no la trae.
  auth:
    build: ./services/auth
    environment:
      AUTH_DATA_DIR: /data/auth
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
    volumes:
      - ./data/auth:/data/auth

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    environment:
      # 0 (por omisión): sin validar tokens, todo public y las rutas nuevas con 403 (RF-ACC-10). 1: valida cada
      # petición a /api/ con auth (auth_request). Se cambia en el .env o al levantar: AUTH_ENABLED=1 docker compose up
      AUTH_ENABLED: ${AUTH_ENABLED:-0}
      # Origen exacto del frontend para /api/auth/, que lleva cookie y no admite el comodín de CORS.
      AUTH_ALLOWED_ORIGIN: ${AUTH_ALLOWED_ORIGIN:-http://localhost:3000}
      # envsubst solo toca ${AUTH_*} en la plantilla; las variables de nginx ($host...) quedan como están.
      NGINX_ENVSUBST_FILTER: "^AUTH_"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./gateway/auth:/etc/nginx/auth:ro
      - ./gateway/snippets:/etc/nginx/snippets:ro
      - ./gateway/15-auth-mode.envsh:/docker-entrypoint.d/15-auth-mode.envsh:ro
    depends_on:
      - catalog
      - verdicts
      - tiles
      - auth

  # Sitio estático de Faro y Atlas en http://localhost:3000. El navegador llama al gateway en :8080.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - gateway
